<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Marvel Movie Quiz</title>
</head>
<body>
    <header>
            <img id="logo" src="images/image2.png">

            <div class="header-title">
            <h1>Marvel Movie Quiz</h1>
            <p>Test Your Marvel Knowledge!</p>
        </div>
    </header>
    <section class="question">
        <h2>1. Who is Spider-Man's alter ego?</h2>
            
            <input type="radio" id="peter-parker" name="question1" value="peter-parker">
            <label for="peter-parker">Peter Parker</label><br>

            <input type="radio" id="tony-stark" name="question1" value="tony-stark">
            <label for="tony-stark">Tony Stark</label><br>

            <input type="radio" id="bruce-banner" name="question1" value="bruce-banner">
            <label for="bruce-banner">Bruce Banner</label><br>

            <input type="radio" id="steve-rogers" name="question1" value="steve-rogers">
            <label for="steve-rogers">Steve Rogers</label><br>
        
    </section>

    <section class="question">
            <h2>2. What is the name of the fictional African nation where Black Panther takes place?</h2>

            <input type="radio" id="genosha" name="question2" value="genosha">
            <label for="genosha">Genosha</label><br>

            <input type="radio" id="wakanda" name="question2" value="wakanda">
            <label for="wakanda">Wakanda</label><br>

            <input type="radio" id="sokovia" name="question2" value="sokovia">
            <label for="sokovia">Sokovia</label><br>

            <input type="radio" id="latveria" name="question2" value="latveria">
            <label for="latveria">Latveria</label><br>

    </section>

    <section class="question">
        <h2>3. Which of the following characters are members of Guardians of the Galaxy?</h2>

        <input type="checkbox" id="star-lord" name="question3" value="star-lord">
        <label for="star-lord">Star-Lord</label><br>

        <input type="checkbox" id="drax" name="question3" value="drax">
        <label for="drax">Drax</label><br>

        <input type="checkbox" id="rocket" name="question3" value="rocket">
        <label for="rocket">Rocket</label><br>

        <input type="checkbox" id="winter-soldier" name="question3" value="winter-soldier">
        <label for="winter-soldier">Winter Soldier</label><br>

     </section>

     <section class="question">
        <h2>4. Which of these are Infinity Stones?</h2>

        <input type="checkbox" id="time-stone" name="question4" value="time-stone">
        <label for="time-stone">Time Stone</label><br>

        <input type="checkbox" id="reality-stone" name="question4" value="reality-stone">
        <label for="reality-stone">Reality Stone</label><br>

        <input type="checkbox" id="vibranium-stone" name="question4" value="vibranium-stone">
        <label for="vibranium-stone">Vibranium Stone</label><br>

        <input type="checkbox" id="space-stone" name="question4" value="space-stone">
        <label for="space-stone">Space Stone</label><br>
    </section>


</body>
</html>
